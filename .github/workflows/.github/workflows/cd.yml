name: CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências de build
        run: pip install build

      - name: Construir o pacote
        run: python -m build

      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-python-dist
          path: dist/
